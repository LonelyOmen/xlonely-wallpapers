name: Publish wallpaper gallery

on:
  push:
    branches: [main]
    paths:
      - 'app.js'
      - 'admin.html'
      - 'admin.js'
      - 'submission-config.js'
      - 'catalog.json'
      - 'favicon.svg'
      - 'index.html'
      - 'previews/**'
      - 'styles.css'
      - '.nojekyll'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout gallery files only
        uses: actions/checkout@v6
        with:
          sparse-checkout: |
            .nojekyll
            app.js
            admin.html
            admin.js
            submission-config.js
            catalog.json
            favicon.svg
            index.html
            previews/
            styles.css
          sparse-checkout-cone-mode: false
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Assemble small site artifact
        run: |
          mkdir -p _site
          cp .nojekyll admin.html admin.js app.js catalog.json favicon.svg index.html styles.css submission-config.js _site/
          cp -a previews _site/previews
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site
          retention-days: 1
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
